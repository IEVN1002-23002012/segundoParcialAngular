<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; font-family: Arial, sans-serif;">
  <div style="width: 100%; max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 6px;">
    
    <h1 style="text-align: center;">Cinépolis</h1>

    <form [formGroup]="cinepolisForm" (ngSubmit)="procesar()">
      
      <!-- ENTRADAS -->
      <div style="margin-bottom: 20px;">
        <h2>Entradas</h2>

        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Nombre</label>
          <input type="text" formControlName="nombre" style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Cantidad Compradores</label>
          <input type="number" formControlName="compradores" style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>

        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Tarjeta Cineco</label>
          <div>
            <label style="margin-right: 15px;"><input type="radio" value="si" formControlName="tarjetaCineco" /> Sí</label>
            <label><input type="radio" value="no" formControlName="tarjetaCineco" /> No</label>
          </div>
        </div>

        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Cantidad De Boletas</label>
          <input type="number" formControlName="boletas" style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
      </div>

      <!-- SALIDAS -->
      <div style="margin-bottom: 20px;">
        <h2>Salidas</h2>
        <div style="margin-bottom: 10px;">
          <label style="display: block; margin-bottom: 5px;">Valor a Pagar</label>
          <div style="font-size: 1.5rem; font-weight: bold; padding: 10px; background: #eee; text-align: center;">
            ${{ valorAPagar }}
          </div>
        </div>

        @if (mensajeError) {
          <div style="color: red; font-weight: bold; margin-top: 5px;">
            {{ mensajeError }}
          </div>
        }
      </div>

      <!-- ACCIONES -->
      <div style="text-align: center; margin-bottom: 10px;">
        <button type="submit" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">
          Procesar
        </button>
      </div>

    </form>
   <div style="text-align: center; margin-bottom: 20px;">
  <button type="button" routerLink="/escuela/ver-registro" style="padding: 10px 20px; font-weight: bold; cursor: pointer; background: #333; color: white; border: none; border-radius: 4px;">
    Ver registros
  </button>
</div>

  </div>
</div>
