<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Contact form</h1>

  <form [formGroup]="formulario">
    <!-- matricula -->
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
        matricula
      </label>

      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your matricula"
      />
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900"> Name </label>

      <input
        type="text"
        id="name"
        name="name"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your name"
      />
    </div>

    <!-- correo -->
    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900"> correo </label>

      <input
        type="text"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your correo"
      />
    </div>

    <!-- materia -->
    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900"> materia </label>

      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your materia"
      />
    </div>

        id="comment"

      ></textarea>
    </div> 
    -->

    <div class="flex justify-end mt-5">
      <button
        type="submit"
        (click)="muestraAlumnos()"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Send
      </button>
    </div>
  </form>

  <h1 class="text-xl font-bold mt-6 mb-2">Lista Alumnos</h1>
  <h2>matricula: {{nuevoAlumno.matricula}}</h2>
  <h2>nombre: {{nuevoAlumno.nombre}}</h2>
  <h2>correo: {{nuevoAlumno.correo}}</h2>
  <h2>materia: {{nuevoAlumno.materia}}</h2>
</div>
